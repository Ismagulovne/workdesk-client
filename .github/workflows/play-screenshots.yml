name: Google Play — скриншоты WorkDesk

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: ID прогона «сборка Windows, Android и Linux» с APK aarch64
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  shots:
    name: Скриншоты на эмуляторе Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        sparse-checkout: .github/play-screens
    - name: APK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: WorkDesk-1.5.3-android-aarch64
        path: apk
        run-id: ${{ inputs.android_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Эмулятор и скриншоты
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: bash .github/play-screens/shoot.sh
    - name: Скриншоты
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: play-screenshots
        path: shots
        retention-days: 14
