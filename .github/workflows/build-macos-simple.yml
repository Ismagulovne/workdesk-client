name: Build macOS x86_64

on:
  workflow_dispatch:

env:
  RUST_VERSION: '1.81'
  FLUTTER_VERSION: '3.44.9'
  VERSION: 1.5.3

jobs:
  build:
    name: Build macOS x86_64
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: brew install create-dmg pkg-config opus opusfile libvpx

      - name: Setup build environment for x86_64
        run: |
          # Get homebrew paths
          OPUS_PATH=$(brew --prefix opus)
          LIBVPX_PATH=$(brew --prefix libvpx)

          # Create VCPKG_ROOT structure
          VCPKG_ROOT="/tmp/vcpkg-setup"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/lib"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/include/opus"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/include/vpx"

          # Copy (not symlink) opus files to VCPKG structure
          cp -r "$OPUS_PATH/include/opus"/* "$VCPKG_ROOT/installed/x64-osx/include/opus/" 2>/dev/null || true
          cp -r "$OPUS_PATH/lib"/* "$VCPKG_ROOT/installed/x64-osx/lib/" 2>/dev/null || true

          # Copy libvpx files
          cp -r "$LIBVPX_PATH/include/vpx"/* "$VCPKG_ROOT/installed/x64-osx/include/vpx/" 2>/dev/null || true
          cp -r "$LIBVPX_PATH/lib"/* "$VCPKG_ROOT/installed/x64-osx/lib/" 2>/dev/null || true

          # Set environment variables
          echo "OPUS_DIR=$OPUS_PATH" >> $GITHUB_ENV
          echo "LIBVPX_DIR=$LIBVPX_PATH" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

          # Setup PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$OPUS_PATH/lib/pkgconfig:$LIBVPX_PATH/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

          # Skip optional codecs
          echo "NO_PKG_CONFIG_aom=1" >> $GITHUB_ENV

      - working-directory: flutter
        run: flutter pub get

      - run: cargo build --release --target=x86_64-apple-darwin

      - working-directory: flutter
        run: flutter build macos --release --build-name=${{ env.VERSION }}

      - run: |
          mkdir -p dist
          cp -r flutter/build/macos/Build/Products/Release/RustDesk.app dist/
          cd dist
          mkdir -p Payload
          cp -r RustDesk.app Payload/
          tar -czf WorkDesk-${{ env.VERSION }}-x86_64.app.tar.gz RustDesk.app

      - uses: actions/upload-artifact@v4
        with:
          name: workdesk-macos-x86_64
          path: dist/*.tar.gz
