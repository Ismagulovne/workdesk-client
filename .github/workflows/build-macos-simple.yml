name: Build macOS x86_64

on:
  workflow_dispatch:

env:
  RUST_VERSION: '1.81'
  FLUTTER_VERSION: '3.44.9'
  VERSION: 1.5.3

jobs:
  build:
    name: Build macOS x86_64
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: brew install create-dmg pkg-config opus opusfile libvpx

      - name: Setup build environment for x86_64
        run: |
          # Create VCPKG_ROOT structure pointing to homebrew packages
          VCPKG_ROOT="/tmp/vcpkg-setup"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/lib"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/include"

          # Symlink all required libraries (use VP9, skip optional AV1)
          for lib in opus opusfile libvpx; do
            lib_path=$(brew --prefix "$lib")
            ln -sf "$lib_path/lib"/* "$VCPKG_ROOT/installed/x64-osx/lib/" 2>/dev/null || true
            ln -sf "$lib_path/include"/* "$VCPKG_ROOT/installed/x64-osx/include/" 2>/dev/null || true
          done

          echo "OPUS_DIR=$(brew --prefix opus)" >> $GITHUB_ENV
          echo "LIBVPX_DIR=$(brew --prefix libvpx)" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

          # Setup PKG_CONFIG_PATH
          PKG_CONFIG_PATH=""
          for lib in opus opusfile libvpx; do
            lib_path=$(brew --prefix "$lib")
            if [ -d "$lib_path/lib/pkgconfig" ]; then
              PKG_CONFIG_PATH="$lib_path/lib/pkgconfig:$PKG_CONFIG_PATH"
            fi
          done
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          # Skip AOM (AV1) which is not available in Homebrew on macOS
          echo "NO_PKG_CONFIG_aom=1" >> $GITHUB_ENV

      - working-directory: flutter
        run: flutter pub get

      - run: cargo build --release --target=x86_64-apple-darwin

      - working-directory: flutter
        run: flutter build macos --release --build-name=${{ env.VERSION }}

      - run: |
          mkdir -p dist
          cp -r flutter/build/macos/Build/Products/Release/RustDesk.app dist/
          cd dist
          mkdir -p Payload
          cp -r RustDesk.app Payload/
          tar -czf WorkDesk-${{ env.VERSION }}-x86_64.app.tar.gz RustDesk.app

      - uses: actions/upload-artifact@v4
        with:
          name: workdesk-macos-x86_64
          path: dist/*.tar.gz
