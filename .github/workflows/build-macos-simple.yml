name: Build macOS x86_64

on:
  workflow_dispatch:

env:
  RUST_VERSION: '1.81'
  FLUTTER_VERSION: '3.44.9'
  VERSION: 1.5.3

jobs:
  build:
    name: Build macOS x86_64
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: brew install create-dmg pkg-config opus opusfile libvpx

      - name: Setup build environment for x86_64
        run: |
          # Setup paths for opus
          echo "OPUS_DIR=$(brew --prefix opus)" >> $GITHUB_ENV
          echo "LIBVPX_DIR=$(brew --prefix libvpx)" >> $GITHUB_ENV

          # Create VCPKG_ROOT structure pointing to homebrew packages
          VCPKG_ROOT="/tmp/vcpkg-setup"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/lib"
          mkdir -p "$VCPKG_ROOT/installed/x64-osx/include"

          # Symlink libvpx (for video encoding)
          ln -sf $(brew --prefix libvpx)/lib/* "$VCPKG_ROOT/installed/x64-osx/lib/" 2>/dev/null || true
          ln -sf $(brew --prefix libvpx)/include/* "$VCPKG_ROOT/installed/x64-osx/include/" 2>/dev/null || true

          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:$(brew --prefix libvpx)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - working-directory: flutter
        run: flutter pub get

      - run: cargo build --release --target=x86_64-apple-darwin

      - working-directory: flutter
        run: flutter build macos --release --build-name=${{ env.VERSION }}

      - run: |
          mkdir -p dist
          cp -r flutter/build/macos/Build/Products/Release/RustDesk.app dist/
          cd dist
          mkdir -p Payload
          cp -r RustDesk.app Payload/
          tar -czf WorkDesk-${{ env.VERSION }}-x86_64.app.tar.gz RustDesk.app

      - uses: actions/upload-artifact@v4
        with:
          name: workdesk-macos-x86_64
          path: dist/*.tar.gz
